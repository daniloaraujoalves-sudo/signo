  <style>
/* ===== Tokens — estilo medieval: pergaminho, tinta, ouro e carmim ===== */
:root {
  --wood: #1f130c;
  --wood-2: #33200f;
  --parchment: #f0e1bd;
  --parchment-2: #e4cf9f;
  --ink: #2b1d12;
  --ink-soft: #5b4630;
  --blood: #7a1f1f;
  --gold: #b8862b;
  --gold-light: #e8c77a;
  --accent: var(--gold);   /* a página de resultado troca pela cor do signo */
  --danger: #8f1414;

  --font-title: "UnifrakturCook", "Cinzel Decorative", Georgia, serif;
  --font-display: "Cinzel", "Cinzel Decorative", Georgia, "Times New Roman", serif;
  --font-body: "IM Fell English", Georgia, "Times New Roman", serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { color-scheme: light; background: var(--wood); }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-size: 1.2rem;
  line-height: 1.6;
  color: var(--ink);
  /* madeira escura com leve veio e vinheta, como a mesa de um escriba */
  background:
    radial-gradient(ellipse at center, transparent 40%, #000a 100%),
    repeating-linear-gradient(90deg, #0000 0 38px, #0003 38px 40px, #0000 40px 90px, #fff1 90px 91px),
    linear-gradient(180deg, var(--wood-2), var(--wood));
  background-attachment: fixed;
}

a { color: var(--blood); text-underline-offset: 3px; }
a:hover { color: var(--ink); }

:focus-visible { outline: 3px solid var(--blood); outline-offset: 3px; }

h1, h2 { margin: 0; font-weight: 700; line-height: 1.1; color: var(--blood); }
h1 { font-family: var(--font-title); }
h2 { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .04em; margin-bottom: 0.9rem; }

/* ===== Pergaminho (painel principal) ===== */
.pergaminho {
  position: relative;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 20% 10%, #fff6 0, transparent 55%),
    radial-gradient(ellipse at 85% 90%, #8a5a1f33 0, transparent 60%),
    linear-gradient(160deg, var(--parchment), var(--parchment-2));
  border: 3px double var(--gold);
  border-radius: 6px;
  box-shadow:
    inset 0 0 0 6px var(--parchment),
    inset 0 0 0 7px var(--gold),
    inset 0 0 60px #7a4c1a55,
    0 18px 40px #000a;
}

.divisor { display: flex; align-items: center; gap: 1rem; margin: 1.1rem 0 1.4rem; color: var(--gold); }
.divisor::before, .divisor::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.divisor span { font-size: 1.4rem; line-height: 1; }

/* ===== Botões ===== */
.btn {
  display: inline-block;
  font: 700 1rem var(--font-display);
  letter-spacing: .06em;
  color: var(--parchment);
  background: linear-gradient(180deg, #9a2a2a, var(--blood));
  border: 2px solid var(--gold);
  border-radius: 4px;
  box-shadow: inset 0 0 0 2px #0004, 0 3px 0 #3d0d0d;
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform .15s, box-shadow .15s, filter .2s;
}
.btn:hover { color: var(--gold-light); filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #0004, 0 1px 0 #3d0d0d; }
.btn-secundario { margin-top: 2.5rem; }

/* ===== Página inicial ===== */
.home-layout {
  max-width: 1120px;
  margin: 0 auto;
  padding: 3rem 1.5rem;
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 3rem;
}

.intro { padding: 2.75rem 2.5rem; }
.selo-topo { margin: 0 0 0.8rem; font: 700 0.85rem var(--font-display); letter-spacing: .25em; text-transform: uppercase; color: var(--gold); }
.intro h1 { font-size: clamp(2.8rem, 6vw, 4.4rem); }
.lead { color: var(--ink-soft); margin: 0 0 2rem; }

form label { display: block; font: 700 0.95rem var(--font-display); letter-spacing: .05em; margin-bottom: 0.5rem; }
.form-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }

input[type="date"] {
  font: inherit;
  color: var(--ink);
  background: #fff8e6;
  border: 2px solid var(--gold);
  border-radius: 4px;
  box-shadow: inset 0 2px 6px #7a4c1a44;
  padding: 0.6rem 0.9rem;
  min-width: 12.5rem;
  color-scheme: light;
}
input[type="date"]:focus { border-color: var(--blood); }
input[aria-invalid="true"] { border-color: var(--danger); }

.erro { min-height: 1.6rem; margin: 0.6rem 0 0; color: var(--danger); font-style: italic; font-size: 1rem; }

/* ===== Roda dos signos (astrolábio) ===== */
.roda-area { display: grid; place-items: center; }

.roda {
  --size: min(88vw, 480px);
  --r: calc(var(--size) * 0.40);
  --rot: 0deg;
  position: relative;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background:
    radial-gradient(circle, var(--parchment) 0 36%, transparent 36.5%),
    radial-gradient(circle, var(--parchment-2), #c9a866);
  border: 5px double var(--gold-light);
  box-shadow: 0 0 0 6px var(--wood), 0 0 0 9px var(--gold), 0 20px 45px #000b, inset 0 0 40px #5a3a1488;
}

.roda-anel {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  /* aro de latão que separa o anel dos símbolos do centro */
  box-shadow: inset 0 0 0 calc(var(--size) * 0.085) transparent,
              inset 0 0 0 calc(var(--size) * 0.085 + 2px) var(--gold);
  transform: rotate(var(--rot));
  transition: transform 1.1s cubic-bezier(.3, .7, .2, 1);
}

.glifo {
  position: absolute;
  top: 50%; left: 50%;
  width: 3rem; height: 3rem;
  margin: -1.5rem 0 0 -1.5rem;
  transform: rotate(var(--a)) translateY(calc(-1 * var(--r)));
}
.glifo span {
  display: grid;
  place-items: center;
  width: 100%; height: 100%;
  font-size: 1.7rem;
  color: var(--ink-soft);
  transform: rotate(calc(-1 * (var(--a) + var(--rot))));
  transition: transform 1.1s cubic-bezier(.3, .7, .2, 1), color .4s, font-size .4s;
}
.glifo.ativo span { color: var(--blood); font-size: 2.4rem; }

/* marca fixa no topo indicando o signo escolhido */
.roda::before {
  content: "";
  position: absolute;
  top: -1.6rem; left: 50%;
  width: 0; height: 0;
  margin-left: -9px;
  border: 9px solid transparent;
  border-top: 14px solid var(--blood);
  filter: drop-shadow(0 2px 0 var(--gold));
  z-index: 2;
}

.roda-centro {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0.3rem;
  pointer-events: none;
}
.roda-centro-simbolo { font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; color: var(--blood); }
.roda-centro-nome { font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 3vw, 1.4rem); color: var(--ink); }

/* ===== Página de resultado ===== */
.resultado-layout { max-width: 800px; margin: 2rem auto 4rem; padding: 2rem 2.25rem 3rem; }
.voltar-topo { margin: 0 0 2rem; }

.estado { color: var(--ink-soft); font-style: italic; }
.estado.erro-estado { color: var(--danger); }

.signo-cabecalho { display: flex; align-items: center; gap: 1.75rem; }
/* medalhão escuro: a cor do signo brilha sobre ele com bom contraste */
.signo-simbolo {
  display: grid; place-items: center;
  width: clamp(6rem, 20vw, 8.5rem);
  aspect-ratio: 1;
  font-size: clamp(3.6rem, 12vw, 5.5rem);
  line-height: 1;
  color: var(--accent);
  background: radial-gradient(circle, #3a2414, var(--wood));
  border: 4px double var(--gold-light);
  border-radius: 50%;
  box-shadow: 0 0 0 3px var(--blood), 0 6px 14px #0006, inset 0 0 18px #000a;
  text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent);
  flex-shrink: 0;
}
.signo-cabecalho h1 { font-size: clamp(2.8rem, 8vw, 4.5rem); }
.signo-nascimento { margin: 0 0 0.3rem; color: var(--ink-soft); font-style: italic; font-size: 1rem; }
.signo-periodo { margin: 0.5rem 0 0; color: var(--ink-soft); font-weight: 700; }

.signo-descricao { font-size: 1.3rem; line-height: 1.65; margin: 0 0 2.25rem; }
/* capitular, como nos manuscritos iluminados */
.signo-descricao::first-letter {
  font-family: var(--font-title);
  float: left;
  font-size: 3.6em;
  line-height: .85;
  padding: .06em .1em 0 0;
  color: var(--blood);
}

.fatos {
  margin: 0 0 2.75rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  border-top: 2px solid var(--gold);
}
.fatos > div { padding: 0.9rem 1rem 0.9rem 0; border-bottom: 1px solid #b8862b88; }
.fatos dt { color: var(--ink-soft); font: 700 0.8rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.fatos dd { margin: 0.15rem 0 0; font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; }
.amostra { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--accent); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--gold); }

.duas-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2.5rem; margin-bottom: 2.75rem; }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li { padding: 0.3rem 0 0.3rem 1.6rem; position: relative; }
/* losango dourado no lugar do marcador */
.lista li::before {
  content: "";
  position: absolute; left: 0.2rem; top: 0.9rem;
  width: 0.5rem; height: 0.5rem;
  background: var(--gold);
  border: 1px solid var(--ink);
  transform: rotate(45deg);
}

.tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.6rem; }
.tags li {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--blood);
  background: #fff8e6;
  border: 2px solid var(--gold);
  border-radius: 4px 14px 4px 14px;
  padding: 0.25rem 1rem;
}

/* ===== Responsivo ===== */
@media (max-width: 820px) {
  .home-layout { grid-template-columns: 1fr; padding-top: 2.5rem; gap: 2.5rem; min-height: auto; }
  .intro { padding: 2rem 1.5rem; }
  .roda-area { order: -1; }
  .roda { --size: min(80vw, 340px); }
  .glifo { width: 2.2rem; height: 2.2rem; margin: -1.1rem 0 0 -1.1rem; }
  .glifo span { font-size: 1.25rem; }
  .glifo.ativo span { font-size: 1.8rem; }
  .resultado-layout { margin: 1rem; padding: 1.5rem 1.25rem 2.5rem; }
  .signo-cabecalho { flex-direction: column; align-items: flex-start; gap: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>

/* Dados e busca dos signos (usado pelas duas páginas).
   Os dados vêm de data/signos.js, gerado a partir do banco SQLite. */

const TEXTO = "︎"; // força o símbolo em modo texto (não emoji)

// Procura o signo de uma data "AAAA-MM-DD". Devolve o objeto do signo ou null.
function buscarSigno(dataISO) {
  const [, m, d] = dataISO.split("-").map(Number);
  const md = m * 100 + d;
  // Capricórnio atravessa o ano (inicio_md > fim_md), por isso o segundo ramo.
  return window.SIGNOS_DADOS.find(s =>
    s.inicio_md <= s.fim_md
      ? md >= s.inicio_md && md <= s.fim_md
      : md >= s.inicio_md || md <= s.fim_md
  ) || null;
}

/* Página inicial: valida a data, gira a roda e redireciona para signo.html */

const SIGNOS = window.SIGNOS_DADOS;

const form   = document.getElementById("form-signo");
const campo  = document.getElementById("data");
const erro   = document.getElementById("erro");
const roda   = document.getElementById("roda");
const anel   = document.getElementById("roda-anel");
const centroSimbolo = document.getElementById("centro-simbolo");
const centroNome    = document.getElementById("centro-nome");

// Data máxima = hoje (no fuso local)
const hoje = new Date();
const hojeISO = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-${String(hoje.getDate()).padStart(2, "0")}`;
campo.max = hojeISO;

// Monta os 12 símbolos ao redor da roda
SIGNOS.forEach((s, i) => {
  const g = document.createElement("div");
  g.className = "glifo";
  g.style.setProperty("--a", `${i * 30}deg`);
  g.title = s.nome;
  const span = document.createElement("span");
  span.textContent = s.simbolo + TEXTO;
  g.appendChild(span);
  anel.appendChild(g);
});

function indiceDoSigno(dataISO) {
  return SIGNOS.indexOf(buscarSigno(dataISO));
}

function dataValida(valor) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return "Informa a data do teu nascimento.";
  const [a, m, d] = valor.split("-").map(Number);
  const dt = new Date(a, m - 1, d);
  if (dt.getFullYear() !== a || dt.getMonth() !== m - 1 || dt.getDate() !== d) return "Essa data não existe. Confere o dia e o mês.";
  if (a < 1900) return "Usa uma data a partir de 1900.";
  if (valor > hojeISO) return "Ninguém nasce no futuro, nobre viajante.";
  return "";
}

function mostrarErro(msg) {
  erro.textContent = msg;
  campo.setAttribute("aria-invalid", msg ? "true" : "false");
}

// Ao escolher a data, a roda gira até o signo correspondente
campo.addEventListener("input", () => {
  if (dataValida(campo.value)) return;
  mostrarErro("");
  const i = indiceDoSigno(campo.value);
  roda.style.setProperty("--rot", `${-i * 30}deg`);
  anel.style.setProperty("--rot", `${-i * 30}deg`);
  anel.querySelectorAll(".glifo").forEach((g, idx) => {
    g.classList.toggle("ativo", idx === i);
    g.firstChild.style.setProperty("--rot", `${-i * 30}deg`);
  });
  centroSimbolo.textContent = SIGNOS[i].simbolo + TEXTO;
  centroNome.textContent = SIGNOS[i].nome;
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const msg = dataValida(campo.value);
  if (msg) {
    mostrarErro(msg);
    campo.focus();
    return;
  }
  window.location.href = `signo.html?data=${encodeURIComponent(campo.value)}`;
});

  </script>
