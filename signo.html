<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teu signo — Pergaminho dos Signos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a1f1f' stroke='%23b8862b' stroke-width='4'/%3E%3Cpath d='M32 12l5 15 15 1-12 9 4 15-12-9-12 9 4-15-12-9 15-1z' fill='%23e8c77a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="resultado">
  <main class="resultado-layout pergaminho">
    <p class="voltar-topo"><a href="index.html">&larr; Consultar outra data</a></p>

    <p id="estado" class="estado" role="status">Consultando os astros…</p>

    <article id="signo" hidden>
      <header class="signo-cabecalho">
        <span class="signo-simbolo" id="simbolo" aria-hidden="true"></span>
        <div>
          <p class="signo-nascimento" id="nascimento"></p>
          <h1 id="nome"></h1>
          <p class="signo-periodo" id="periodo"></p>
        </div>
      </header>

      <p class="divisor" aria-hidden="true"><span>&#10086;</span></p>

      <p class="signo-descricao" id="descricao"></p>

      <dl class="fatos">
        <div><dt>Elemento</dt><dd id="elemento"></dd></div>
        <div><dt>Modalidade</dt><dd id="modalidade"></dd></div>
        <div><dt>Planeta regente</dt><dd id="regente"></dd></div>
        <div><dt>Cor do brasão</dt><dd><span class="amostra" id="amostra"></span><span id="cor"></span></dd></div>
        <div><dt>Pedra</dt><dd id="pedra"></dd></div>
        <div><dt>Dia da semana</dt><dd id="dia"></dd></div>
        <div><dt>Números da sorte</dt><dd id="numeros"></dd></div>
      </dl>

      <div class="duas-colunas">
        <section>
          <h2>Virtudes</h2>
          <ul class="lista" id="qualidades"></ul>
        </section>
        <section>
          <h2>Provações</h2>
          <ul class="lista" id="desafios"></ul>
        </section>
      </div>

      <section>
        <h2>Aliados do teu signo</h2>
        <ul class="tags" id="compatibilidade"></ul>
      </section>

      <a class="btn btn-secundario" href="index.html">Consultar outra data</a>
    </article>
  </main>

  <script src="data/signos.js"></script>
  <script src="js/zodiaco.js"></script>
  <script src="js/signo.js"></script>
</body>
</html>
